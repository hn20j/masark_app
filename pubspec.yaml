name: masarak
description: "Masarak (مسارك) - AI-powered CV & job application assistant"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.15.0
  google_fonts: ^6.2.1
  file_picker: ^8.1.2
  provider: ^6.1.2
  intl: ^0.20.2
  flutter_svg: ^2.0.10+1
  percent_indicator: ^4.2.3
  firebase_data_connect: ^0.3.3
  shared_preferences: ^2.5.5
  firebase_auth: ^6.7.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1
  cloud_firestore: ^6.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  firebase_auth_mocks: ^0.15.2
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
